baseURL = "https://ai-solutions.wiki"
locale = "en-us"
title = "AI Solutions Wiki"
enableRobotsTXT = true
enableGitInfo = false
buildFuture = true

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepQuotes = true
[pagination]
  pagerSize = 20

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = false
    codeFences = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2

[params]
  description = "Engineering reference for production AI systems: architecture patterns, evaluation methods, operational practices, governance, and tooling for teams building enterprise-grade AI. Maintained by AWS Community Hero Linda Mohamed."
  # AI Film Crew course video: set this to the YouTube id of the full-course upload and every
  # chapter deep-links into it via its `video_start` seconds. (A chapter can override with its
  # own `youtube:` in front matter.) Empty = a "coming soon" placeholder is shown.
  courseYoutube = ""
  # Origin/CDN that serves the remotion `public/` assets (clips, guide, stills) for the live
  # Remotion Player on course pages, e.g. "https://cdn.example.com". Empty = placeholder.
  playerAssetBase = ""
  # Origin/CDN serving the rendered per-module course videos (out/module*.mp4). Empty = placeholder.
  videoBase = "/videos/course"
  author = "Linda Mohamed"
  authorName = "Linda Mohamed"
  authorURL = "https://lindamohamed.com"
  authorRole = "AWS Community Hero, AI Architect"
  twitterHandle = ""
  defaultOgImage = "/og-default.png"
  siteURL = "https://ai-solutions.wiki"
  workshopsURL = "https://ai-workshops.online"
  workshopsOverviewURL = "https://www.lindamohamed.com/workshops"
  workshopSeriesURL = "https://www.lindamohamed.com/offers/m6KponLm"
  consultingURL = "https://www.lindamohamed.com/offers/HL2FFzBM"
  freelancerTemplatesURL = "https://freelancer-templates.org"
  freelancerAutomationURL = "https://freelancer-automation.com"
  primaryColor = "#2563eb"
  accentColor = "#10b981"
  darkBg = "#0f172a"
  logoText = "AI Solutions Wiki"
  searchPlaceholder = "Search 200+ articles..."
  showReadingTime = true
  showWordCount = false
  showLastmod = true

[taxonomies]
  category = "categories"
  tag = "tags"
  industry = "industries"
  # NOTE: no `tool = "tools"` taxonomy on purpose. It collided with the content/tools/
  # section (both resolve to /tools/), which made /tools/ render ~13 taxonomy terms
  # instead of the 180 service pages. The `tools:` frontmatter is still read as metadata.

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMSTXT"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

[outputFormats]
  [outputFormats.JSON]
    mediaType = "application/json"
    baseName = "index"
    isPlainText = true
  [outputFormats.LLMSTXT]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true

