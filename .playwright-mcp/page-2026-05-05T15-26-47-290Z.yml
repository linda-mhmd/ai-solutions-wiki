        - heading "Your team has AI ideas but no roadmap" [level=3] [ref=e45]
        - paragraph [ref=e46]: Everyone knows AI matters. But turning vague ambitions into a concrete, prioritized plan that your team can actually execute is where most organizations get stuck.
