<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Top layer: filled white diamond (matches nav layers icon) -->
  <polygon points="16,5 5,10.5 16,16 27,10.5" fill="white"/>

  <!-- Middle layer: white chevron -->
  <polyline
    points="5,14 16,19.5 27,14"
    fill="none"
    stroke="white"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom layer: lighter chevron for depth -->
  <polyline
    points="5,18.5 16,24 27,18.5"
    fill="none"
    stroke="rgba(255,255,255,0.55)"
    stroke-width="2.4"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
