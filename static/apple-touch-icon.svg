<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background (iOS clips to rounded square automatically) -->
  <rect width="180" height="180" fill="url(#bg)"/>

  <!-- Top layer: filled white diamond -->
  <polygon points="90,28 28,59 90,90 152,59" fill="white"/>

  <!-- Middle layer: white chevron -->
  <polyline
    points="28,79 90,110 152,79"
    fill="none"
    stroke="white"
    stroke-width="13.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Bottom layer: lighter chevron -->
  <polyline
    points="28,104 90,135 152,104"
    fill="none"
    stroke="rgba(255,255,255,0.55)"
    stroke-width="13.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
