{{ define "main" }}
<style>
  .xl-page { display: flex; flex-direction: column; height: calc(100vh - 60px); height: calc(100dvh - 60px); overflow: hidden; background: var(--bg); }
  .xl-top { display: flex; align-items: center; gap: 1rem; padding: 0.85rem 1.3rem; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; flex-wrap: wrap; }
  .xl-title { font: 700 1.05rem/1.2 var(--font); color: var(--text-primary); }
  .xl-meta { font: 0.72rem/1 var(--font-mono); color: var(--text-secondary); margin-top: 3px; }
  .xl-search { flex: 1; min-width: 200px; max-width: 420px; margin-left: auto; background: var(--bg); border: 1px solid var(--border-strong); border-radius: 8px; padding: 0.5rem 0.8rem; color: var(--text-primary); font-size: 0.875rem; outline: none; }
  .xl-search:focus { border-color: var(--primary); }
  .xl-body { flex: 1; overflow-y: auto; padding: 1.1rem 1.3rem 3rem; }
  .xl-domain { font: 700 1.02rem/1.2 var(--font); color: var(--text-primary); display: flex; align-items: center; gap: 0.5rem; border-bottom: 1px solid var(--border-strong); padding-bottom: 0.4rem; margin: 1.7rem 0 0.5rem; }
  .xl-domain:first-child { margin-top: 0; }
  .xl-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .xl-dom-ct { margin-left: auto; font: 0.74rem/1 var(--font-mono); color: var(--text-secondary); font-weight: 400; }
  .xl-sub { font: 600 0.66rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin: 0.9rem 0 0.4rem; }
  .xl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1px 1.2rem; }
  .xl-item { display: flex; align-items: center; gap: 0.5rem; padding: 0.32rem 0.45rem; border-radius: 6px; text-decoration: none; color: var(--text-primary); font-size: 0.86rem; line-height: 1.3; }
  .xl-item:hover { background: rgba(127, 127, 127, 0.09); text-decoration: none; }
  .xl-item .b { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .xl-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .xl-none { color: var(--text-secondary); padding: 2rem 0; }
</style>

<div class="xl-page">
  {{ partial "explore-switcher.html" (dict "page" . "inline" true) }}
  <div class="xl-top">
    <div>
      <div class="xl-title">Browse all content</div>
      <div class="xl-meta" id="xl-meta"></div>
    </div>
    <input type="search" id="xl-search" class="xl-search" placeholder="Filter articles..." autocomplete="off" aria-label="Filter articles">
  </div>
  <div class="xl-body" id="xl-body"></div>
</div>

<script>
(function () {
  var D = JSON.parse({{ .Site.Data.galaxy_planet | jsonify }});
  var DIFF = D.difficulties || {};
  var domColor = {}; (D.domains || []).forEach(function (d) { domColor[d.id] = d.color; });
  var body = document.getElementById('xl-body');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var total = 0;
  (D.domains || []).forEach(function (d) {
    d.subdomains.forEach(function (s) { total += s.concepts.length; });
  });
  document.getElementById('xl-meta').textContent = total + ' articles across ' + (D.domains || []).length + ' domains';

  // Render once into the DOM; filtering toggles display.
  (D.domains || []).forEach(function (d) {
    var dom = document.createElement('section'); dom.className = 'xl-dom-section'; dom.dataset.dom = d.id;
    var h = document.createElement('div'); h.className = 'xl-domain';
    h.innerHTML = '<span class="xl-dot" style="background:' + (d.color || '#888') + '"></span>' + esc(d.name) +
      '<span class="xl-dom-ct" data-base="' + d.name + '"></span>';
    dom.appendChild(h);
    var domCount = 0;
    d.subdomains.forEach(function (s) {
      var sl = document.createElement('div'); sl.className = 'xl-sub'; sl.textContent = s.name;
      dom.appendChild(sl);
      var grid = document.createElement('div'); grid.className = 'xl-grid';
      s.concepts.forEach(function (c) {
        var a = document.createElement('a'); a.className = 'xl-item'; a.href = c.url || '#';
        a.dataset.name = (c.name || '').toLowerCase();
        var col = (DIFF[c.difficulty] || {}).color || '#888';
        a.innerHTML = '<span class="b" style="background:' + col + '"></span><span class="t">' + esc(c.name) + '</span>';
        grid.appendChild(a); domCount++;
      });
      dom.appendChild(grid);
    });
    h.querySelector('.xl-dom-ct').textContent = domCount;
    body.appendChild(dom);
  });

  var search = document.getElementById('xl-search');
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase();
    body.querySelectorAll('.xl-dom-section').forEach(function (sec) {
      var anyDom = false;
      sec.querySelectorAll('.xl-grid').forEach(function (grid) {
        var anySub = false;
        grid.querySelectorAll('.xl-item').forEach(function (a) {
          var hit = !q || a.dataset.name.indexOf(q) !== -1;
          a.style.display = hit ? '' : 'none';
          if (hit) anySub = true;
        });
        grid.style.display = anySub ? '' : 'none';
        grid.previousElementSibling.style.display = anySub ? '' : 'none'; // the .xl-sub label
        if (anySub) anyDom = true;
      });
      sec.style.display = anyDom ? '' : 'none';
    });
  });
})();
</script>
{{ end }}
