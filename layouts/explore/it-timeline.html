{{ define "main" }}
<style>
  :root { --map-rail: 300px; --map-panel: 380px; }
  /* drag-to-resize handles, overlaid on the body at each panel boundary (rail + right panel),
     so the rail's own scroll does not clip them. Match galaxy/knowledge-graph behaviour. */
  .itm-body { position:relative; }
  .itm-resize { position:absolute; top:0; width:11px; height:100%; cursor:ew-resize; z-index:25; touch-action:none; }
  .itm-resize::after { content:""; position:absolute; top:0; bottom:0; left:50%; width:2px; transform:translateX(-50%); background:transparent; transition:background .12s; }
  .itm-resize-l { left:var(--map-rail); transform:translateX(-6px); }
  .itm-resize-r { right:var(--map-panel); transform:translateX(6px); }
  .itm-resize:hover::after, body.itm-resizing .itm-resize::after { background:var(--accent); }
  .itm-body:not(.itm-panel-open) .itm-resize-r { display:none; }  /* panel handle only when panel is open */
  body.itm-resizing { user-select:none; cursor:ew-resize; }
  @media (max-width:900px) { .itm-resize { display:none; } }
  .itm-page { display:flex; flex-direction:column; height:calc(100vh - 60px); height:calc(100dvh - 60px); overflow:hidden; background:var(--bg); }

  /* Top bar */
  .itm-top { display:flex; align-items:center; gap:1rem; padding:0.7rem 1.1rem; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0; flex-wrap:wrap; }
  .itm-top-title { font-size:1.05rem; font-weight:700; color:var(--text-primary); white-space:nowrap; }
  .itm-top-sub { font-size:0.86rem; font-family:var(--font-mono); color:var(--text-secondary); white-space:nowrap; }
  .itm-search-wrap { position:relative; flex:1; min-width:180px; max-width:340px; margin-left:auto; }
  .itm-search { width:100%; background:var(--bg); border:1px solid var(--border-strong); border-radius:8px; padding:0.45rem 0.7rem 0.45rem 2.1rem; color:var(--text-primary); font-size:0.85rem; outline:none; }
  .itm-search:focus { border-color:var(--accent); }
  .itm-search-ic { position:absolute; left:0.6rem; top:50%; transform:translateY(-50%); color:var(--text-secondary); }
  .itm-modes { display:flex; gap:0; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; }
  .itm-mode { appearance:none; background:none; border:none; color:var(--text-secondary); font-size:0.78rem; font-family:var(--font-mono); padding:0.4rem 0.8rem; cursor:pointer; display:flex; align-items:center; gap:0.35rem; }
  .itm-mode.on { background:var(--accent); color:#fff; }

  .itm-body { flex:1; display:flex; min-height:0; }

  /* Left rail */
  .itm-rail { width:var(--map-rail); flex-shrink:0; border-right:1px solid var(--border); background:var(--surface); padding:0.9rem 0.9rem 1.2rem; overflow-y:auto; }
  .itm-rail-h { font-size:0.8rem; font-family:var(--font-mono); font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--text-secondary); margin:1.2rem 0 0.55rem; }
  .itm-rail-h:first-child { margin-top:0; }
  .itm-seg { display:flex; border:1px solid var(--border-strong); border-radius:8px; overflow:hidden; }
  .itm-seg button { flex:1; appearance:none; background:none; border:none; color:var(--text-secondary); font-size:0.84rem; font-family:var(--font-mono); padding:0.45rem 0; cursor:pointer; }
  .itm-seg button.on { background:rgba(224,49,75,.15); color:var(--text-primary); }
  .itm-chip { appearance:none; background:none; display:flex; align-items:center; gap:0.5rem; width:100%; text-align:left; font-size:0.88rem; font-family:var(--font-mono); color:var(--text-secondary); cursor:pointer; padding:0.36rem 0.45rem; border-radius:6px; border:1px solid transparent; }
  .itm-chip:hover { background:rgba(127,127,127,.08); color:var(--text-primary); }
  .itm-chip.off { opacity:0.4; }
  .itm-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .itm-zoombtns { display:flex; gap:0.4rem; margin-top:0.5rem; }
  .itm-zoombtns button { flex:1; appearance:none; background:var(--bg); border:1px solid var(--border-strong); color:var(--text-secondary); border-radius:6px; padding:0.35rem 0; font-size:0.85rem; cursor:pointer; }
  .itm-zoombtns button:hover { border-color:var(--accent); color:var(--text-primary); }

  /* Stage */
  .itm-stage { flex:1; display:flex; flex-direction:column; min-width:0; position:relative; }
  .itm-viewport { flex:1; position:relative; overflow:hidden; cursor:grab;
    user-select:none; -webkit-user-select:none;   /* dragging to pan must not select node text */
    background:
      radial-gradient(1200px 600px at 30% -10%, rgba(224,49,75,.06), transparent 60%),
      linear-gradient(var(--bg), var(--bg));
    background-color:var(--bg); }
  .itm-viewport.grabbing { cursor:grabbing; }
  .itm-viewport::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size:42px 42px; }
  [data-theme="light"] .itm-viewport::before { background-image:linear-gradient(rgba(0,0,0,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.04) 1px, transparent 1px); }
  .itm-world { position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .itm-world.anim { transition:transform .55s cubic-bezier(.22,.61,.36,1); }
  .itm-edges { position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }

  /* Era column bands + headers (inside world) */
  .itm-band { position:absolute; top:0; border-left:1px dashed var(--border); }
  .itm-erahead { position:absolute; }
  .itm-erahead-name { font:700 0.95rem/1.2 var(--font); color:var(--text-primary); }
  .itm-erahead-span { display:block; font:600 0.66rem/1 var(--font-mono); letter-spacing:.04em; color:var(--text-secondary); margin-top:3px; }
  .itm-erahead-mark { width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:7px; vertical-align:middle; box-shadow:0 0 12px currentColor; }

  /* Node card */
  .itm-node { position:absolute; width:228px; background:linear-gradient(160deg, var(--surface), color-mix(in srgb, var(--surface) 88%, #000)); border:1px solid var(--border); border-radius:14px; padding:11px 13px; cursor:pointer; box-shadow:0 6px 22px rgba(0,0,0,.38); transition:transform .15s, box-shadow .15s, border-color .15s, opacity .15s; }
  .itm-node:hover { transform:translateY(-3px); border-color:var(--border-strong); box-shadow:0 14px 34px rgba(0,0,0,.55); }
  .itm-node.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 14px 34px rgba(0,0,0,.55); }
  .itm-node.faded { opacity:.28; }
  .itm-node-top { display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .itm-node-ic { width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .itm-node-ic svg { width:17px; height:17px; }
  .itm-node-year { margin-left:auto; font:700 0.66rem/1 var(--font-mono); color:var(--text-secondary); background:var(--bg); border:1px solid var(--border); border-radius:999px; padding:4px 7px; white-space:nowrap; }
  .itm-node-name { font:700 0.92rem/1.25 var(--font); color:var(--text-primary); }
  .itm-node-foot { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .itm-node-life { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .itm-node-lifetx { font:0.62rem/1 var(--font-mono); color:var(--text-secondary); }

  /* Scrubber */
  .itm-scrub { flex-shrink:0; border-top:1px solid var(--border); background:var(--surface); padding:0.55rem 0.8rem; }
  .itm-scrub-track { display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:3px; scrollbar-width:thin; }
  .itm-scrub-chip { flex-shrink:0; appearance:none; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:0.3rem 0.6rem; cursor:pointer; text-align:left; min-width:96px; transition:border-color .12s, transform .12s; }
  .itm-scrub-chip:hover { border-color:var(--accent); transform:translateY(-2px); }
  .itm-scrub-chip.on { border-color:var(--accent); background:rgba(224,49,75,.1); }
  .itm-scrub-y { display:block; font:700 0.64rem/1 var(--font-mono); color:var(--accent); }
  .itm-scrub-n { display:block; font:0.7rem/1.2 var(--font); color:var(--text-primary); margin-top:3px; max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Detail panel */
  .itm-panel { width:var(--map-panel); flex-shrink:0; border-left:1px solid var(--border-strong); background:var(--surface); display:flex; flex-direction:column; overflow:hidden; }
  .itm-panel[hidden] { display:none; }
  .itm-panel-hd { padding:1rem 1rem 0.85rem; border-bottom:1px solid var(--border); position:relative; }
  .itm-panel-x { position:absolute; top:0.7rem; right:0.7rem; appearance:none; background:var(--bg); border:1px solid var(--border-strong); color:var(--text-secondary); border-radius:6px; width:26px; height:26px; cursor:pointer; line-height:1; }
  .itm-panel-x:hover { border-color:var(--accent); color:var(--text-primary); }
  .itm-panel-badges { display:flex; gap:0.4rem; flex-wrap:wrap; margin-bottom:0.5rem; }
  .itm-badge { font:600 0.6rem/1 var(--font-mono); letter-spacing:.04em; text-transform:uppercase; padding:0.22rem 0.45rem; border-radius:999px; display:inline-flex; align-items:center; gap:0.3rem; }
  .itm-panel-name { font-size:1.2rem; font-weight:700; color:var(--text-primary); line-height:1.25; margin:0; padding-right:1.8rem; }
  .itm-panel-year { font:700 0.74rem/1 var(--font-mono); color:var(--text-secondary); margin-top:0.35rem; }
  .itm-panel-bd { flex:1; overflow-y:auto; padding:0.9rem 1rem; }
  .itm-figure { margin:0 0 1rem; }
  .itm-figwrap { position:relative; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:#0a0a0a; }
  .itm-figwrap img { display:block; width:100%; height:auto; max-height:300px; object-fit:contain; background:#0a0a0a; }
  .itm-figwrap::after { content:""; position:absolute; left:0; right:0; bottom:0; height:44px; background:linear-gradient(transparent, rgba(0,0,0,.82)); pointer-events:none; }
  .itm-figlic { position:absolute; right:7px; bottom:5px; z-index:2; max-width:88%; text-align:right; font:400 0.52rem/1.35 var(--font-mono); letter-spacing:.02em; color:rgba(255,255,255,.66); }
  .itm-figlic a { color:rgba(255,255,255,.7); text-decoration:none; }
  .itm-figlic a:hover { color:#fff; text-decoration:underline; }
  .itm-figtitle { font:600 0.82rem/1.4 var(--font); color:var(--text-primary); margin:0.55rem 0 0; }
  .itm-lab { font:600 0.64rem/1 var(--font-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--text-secondary); margin:1rem 0 0.4rem; }
  .itm-lab:first-child { margin-top:0; }
  .itm-tx { font-size:0.84rem; color:var(--text-secondary); line-height:1.55; margin:0; }
  .itm-kv { display:grid; grid-template-columns:auto 1fr; gap:0.3rem 0.7rem; font-size:0.8rem; }
  .itm-kv dt { color:var(--text-secondary); font-family:var(--font-mono); font-size:0.72rem; }
  .itm-kv dd { color:var(--text-primary); margin:0; }
  .itm-legal { font-size:0.8rem; color:var(--text-primary); background:rgba(236,72,153,.08); border:1px solid rgba(236,72,153,.3); border-radius:8px; padding:0.55rem 0.7rem; line-height:1.5; margin:0; }
  .itm-rel { display:flex; flex-wrap:wrap; gap:0.35rem; }
  .itm-relbtn { appearance:none; background:var(--bg); border:1px solid var(--border-strong); border-radius:999px; padding:0.25rem 0.6rem; font-size:0.74rem; color:var(--text-primary); cursor:pointer; }
  .itm-relbtn.newer:hover { border-color:#22c55e; }
  .itm-relbtn.older:hover { border-color:#06b6d4; }
  .itm-src { display:flex; flex-direction:column; gap:0.5rem; }
  .itm-src a { display:flex; gap:0.5rem; align-items:flex-start; font-size:0.79rem; color:var(--accent); text-decoration:none; line-height:1.4; }
  .itm-src a:hover { text-decoration:underline; }
  .itm-src-k { flex-shrink:0; font:600 0.56rem/1.3 var(--font-mono); text-transform:uppercase; color:var(--text-secondary); border:1px solid var(--border-strong); border-radius:4px; padding:0.1rem 0.3rem; }
  .itm-panel-ft { flex-shrink:0; border-top:1px solid var(--border); padding:0.75rem 1rem; }
  .itm-open { display:flex; align-items:center; justify-content:center; gap:0.4rem; background:var(--accent); color:#fff; border:none; border-radius:8px; padding:0.55rem; font-size:0.85rem; font-weight:600; text-decoration:none; width:100%; }
  .itm-open:hover { opacity:.88; }

  /* List (timeline) mode */
  .itm-list { flex:1; overflow-y:auto; padding:1.2rem 1.4rem 4rem; }
  .itm-list-inner { max-width:760px; margin:0 auto; }
  .itm-list-era { font:700 1.15rem/1.2 var(--font); color:var(--text-primary); border-bottom:1px solid var(--border-strong); padding-bottom:0.4rem; margin:1.6rem 0 0.9rem; }
  .itm-list-row { display:grid; grid-template-columns:58px 1fr; gap:14px; padding:0 0 0.7rem; }
  .itm-list-y { font:700 0.72rem/1 var(--font-mono); color:var(--text-primary); background:var(--surface); border:1.5px solid var(--border-strong); border-radius:999px; padding:6px 2px; text-align:center; height:fit-content; }
  .itm-list-card { background:var(--surface); border:1px solid var(--border); border-left-width:3px; border-radius:10px; padding:9px 13px; cursor:pointer; transition:border-color .15s, box-shadow .15s, background .15s; }
  .itm-list-card:hover { border-color:var(--border-strong); }
  .itm-list-card.sel { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--surface)); }
  .itm-list-empty { color:var(--text-secondary); font-size:0.95rem; padding:2rem 0; text-align:center; }
  .itm-hint { position:absolute; bottom:0.7rem; left:50%; transform:translateX(-50%); font:0.72rem/1 var(--font-mono); color:var(--text-secondary); background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:0.35rem 0.8rem; pointer-events:none; }

  @media (max-width:900px) {
    .itm-rail { display:none; }
    .itm-panel { position:absolute; right:0; left:0; bottom:0; top:auto; width:100%; height:64%; border-left:none; border-top:1px solid var(--border-strong); border-radius:14px 14px 0 0; z-index:30; box-shadow:0 -10px 40px rgba(0,0,0,.5); }
  }
</style>

<div class="itm-page">
{{ partial "explore-switcher.html" (dict "page" . "inline" true) }}
  <div class="itm-top">
    <div>
      <div class="itm-top-title">{{ .Title }}</div>
      <div class="itm-top-sub" id="itm-count"></div>
    </div>
    <div class="itm-search-wrap">
      <svg class="itm-search-ic" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="itm-search" class="itm-search" placeholder="Search technologies, people, events..." autocomplete="off" aria-label="Search the IT history map">
    </div>
    <div class="itm-modes" role="tablist" aria-label="View mode">
      <button class="itm-mode on" id="itm-mode-map" role="tab" aria-selected="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v3a3 3 0 0 0 3 3h6"/></svg>
        Map
      </button>
      <button class="itm-mode" id="itm-mode-list" role="tab" aria-selected="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        Timeline
      </button>
    </div>
  </div>

  <div class="itm-body">
    <aside class="itm-rail" id="itm-rail">
      <div class="itm-rail-h">Density</div>
      <div class="itm-seg" id="itm-density">
        <button data-d="key" class="on">Highlights</button>
        <button data-d="all">All 104</button>
      </div>
      <div class="itm-zoombtns">
        <button id="itm-zout" aria-label="Zoom out">&minus;</button>
        <button id="itm-zfit" aria-label="Reset view">Fit</button>
        <button id="itm-zin" aria-label="Zoom in">+</button>
      </div>

      <div class="itm-rail-h">Status</div>
      <div id="itm-life-filters"></div>

      <div class="itm-rail-h">Type</div>
      <div id="itm-cat-filters"></div>
    </aside>

    <div class="itm-stage" id="itm-stage">
      <div class="itm-viewport" id="itm-viewport">
        <div class="itm-world" id="itm-world">
          <svg class="itm-edges" id="itm-edges" aria-hidden="true"></svg>
          <div id="itm-nodes"></div>
        </div>
        <div class="itm-hint" id="itm-hint">Drag to pan, scroll to zoom, click a node to explore its connections</div>
      </div>
      <div class="itm-scrub">
        <div class="itm-scrub-track" id="itm-scrub"></div>
      </div>
    </div>

    <div class="itm-list" id="itm-list" hidden><div class="itm-list-inner" id="itm-list-inner"></div></div>

    <aside class="itm-panel" id="itm-panel" hidden aria-label="Details">
      <div class="itm-panel-hd">
        <button class="itm-panel-x" id="itm-panel-x" aria-label="Close">&times;</button>
        <div class="itm-panel-badges" id="itm-panel-badges"></div>
        <h2 class="itm-panel-name" id="itm-panel-name"></h2>
        <div class="itm-panel-year" id="itm-panel-year"></div>
      </div>
      <div class="itm-panel-bd" id="itm-panel-bd"></div>
      <div class="itm-panel-ft"><a class="itm-open" id="itm-open" href="#" hidden>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Learn on this wiki</a></div>
    </aside>
    <div class="itm-resize itm-resize-l" id="itm-resize-l" role="separator" aria-orientation="vertical" aria-label="Drag to resize the filters" title="Drag to resize"></div>
    <div class="itm-resize itm-resize-r" id="itm-resize-r" role="separator" aria-orientation="vertical" aria-label="Drag to resize the details panel" title="Drag to resize"></div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var DATA = JSON.parse({{ .Site.Data.it_timeline | jsonify }});
  var IMAGES = JSON.parse({{ .Site.Data.it_timeline_images | jsonify }});
  var ITEMS = DATA.items || [], ERAS = DATA.eras || [], LIFE = DATA.lifecycles || [], CATS = DATA.categories || [];
  // Article URLs are kept in learning.json (single source of truth). Inject id -> url so each
  // timeline entry links to its real article instead of nowhere.
  var ITM_URLS = {};
  try {
    var LEARN = JSON.parse({{ .Site.Data.learning | jsonify }});
    (LEARN.nodes || []).forEach(function (n) { if (n.learn_url) ITM_URLS[n.id] = n.learn_url; });
  } catch (e) {}
  ITEMS.forEach(function (i) { if (!i.wiki_url && ITM_URLS[i.id]) i.wiki_url = ITM_URLS[i.id]; });
  var lifeById = {}; LIFE.forEach(function (l) { lifeById[l.id] = l; });
  var catById = {};  CATS.forEach(function (c) { catById[c.id] = c; });
  var byId = {}; ITEMS.forEach(function (i) { byId[i.id] = i; });
  var eraIndex = {}; ERAS.forEach(function (e, i) { eraIndex[e.id] = i; });

  // Curated marquee set for the "Highlights" density.
  var KEY = {};
  ['abacus','analytical-engine','turing-machine','eniac','transistor','integrated-circuit','cobol',
   'system-360','moores-law','arpanet','unix','intel-4004','relational-model','tcp-ip','sql',
   'ibm-pc','gui-mac','www','linux','sap','http-html','java','vmware-esx','rest','dynatrace-apm','git',
   'aws-s3','aws-ec2','cloud-term','iphone','github','docker','kubernetes','terraform','transformer',
   'gpt3','chatgpt','gpt4-claude','hashicorp-bsl','broadcom-vmware','gartner-mq','hype-cycle'
  ].forEach(function (id) { KEY[id] = 1; });

  // Reverse relationships.
  ITEMS.forEach(function (i) { i._rs = []; i._ra = []; });
  ITEMS.forEach(function (i) {
    (i.superseded_by || []).forEach(function (t) { if (byId[t]) byId[t]._rs.push(i.id); });
    (i.abstraction_of || []).forEach(function (t) { if (byId[t]) byId[t]._ra.push(i.id); });
  });
  function newerOf(i) { return uniq((i.superseded_by || []).concat(i._ra)); }
  function olderOf(i) { return uniq((i.abstraction_of || []).concat(i._rs)); }
  function uniq(a) { var s = {}, o = []; a.forEach(function (x) { if (!s[x]) { s[x] = 1; o.push(x); } }); return o; }

  var CAT_GLYPH = {

  // ---- helpers ----
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hexA(hex, a) { if (!hex || hex[0] !== '#' || hex.length < 7) return 'rgba(127,127,127,' + a + ')'; return 'rgba(' + parseInt(hex.slice(1, 3), 16) + ',' + parseInt(hex.slice(3, 5), 16) + ',' + parseInt(hex.slice(5, 7), 16) + ',' + a + ')'; }

  var nSrc = ITEMS.reduce(function (n, i) { return n + ((i.sources && i.sources.length) || 0); }, 0);
  document.getElementById('itm-count').textContent = ITEMS.length + ' milestones, ' + ERAS.length + ' eras, ' + nSrc + ' cited sources';

  render();
  // Re-stack once web fonts finish loading, since card heights depend on them.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { render(); });
  if (window.innerWidth < 900) setMode('list');
})();

// Resizable left rail + right panel. Widths persist in shared localStorage keys so the galaxy
// and timeline use the SAME defaults and saved sizes, and switching tabs does not jump.
(function () {
  var root = document.documentElement;
  var RAIL_KEY = 'aiwiki.railW', PANEL_KEY = 'aiwiki.panelW';
  var RAIL = { varName: '--map-rail', key: RAIL_KEY, min: 240, max: 460, def: 300, left: true };
  var PANEL = { varName: '--map-panel', key: PANEL_KEY, min: 300, max: 620, def: 380, left: false };
  function applySaved(o) {
    try { var v = parseInt(localStorage.getItem(o.key), 10); if (v >= o.min) root.style.setProperty(o.varName, Math.min(v, o.max) + 'px'); } catch (e) {}
  }
  applySaved(RAIL); applySaved(PANEL);
  function curW(o) { return parseInt(getComputedStyle(root).getPropertyValue(o.varName), 10) || o.def; }
  function drag(handle, o) {
    if (!handle) return;
    var active = false, startX = 0, startW = 0;
    handle.addEventListener('pointerdown', function (e) {
      active = true; startX = e.clientX; startW = curW(o);
      document.body.classList.add('itm-resizing'); handle.setPointerCapture(e.pointerId); e.preventDefault();
    });
    handle.addEventListener('pointermove', function (e) {
      if (!active) return;
      var dx = e.clientX - startX;
      var w = Math.max(o.min, Math.min(o.max, o.left ? startW + dx : startW - dx));
      root.style.setProperty(o.varName, w + 'px');
    });
    function end() { if (!active) return; active = false; document.body.classList.remove('itm-resizing'); try { localStorage.setItem(o.key, curW(o)); } catch (e) {} }
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
    handle.addEventListener('dblclick', function () { root.style.setProperty(o.varName, o.def + 'px'); try { localStorage.setItem(o.key, o.def); } catch (e) {} });
  }
  drag(document.getElementById('itm-resize-l'), RAIL);
  drag(document.getElementById('itm-resize-r'), PANEL);
})();
