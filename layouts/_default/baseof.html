<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}" data-theme="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <div class="reading-progress" aria-hidden="true"></div>
  {{ partial "nav.html" . }}
  <main id="main-content">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}

  <script src="{{ "js/wiki-library.js" | relURL }}" defer></script>
  <script src="{{ "pagefind/pagefind-ui.js" | relURL }}"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function() {
      const params = new URLSearchParams(window.location.search);
      const initialQuery = params.get('q') || '';

      const mainSearch = new PagefindUI({
        element: "#search",
        showSubResults: true,
        showImages: false,
        showFilters: true,
        baseUrl: "{{ "" | relURL }}"
      });

      if (document.getElementById('hero-search')) {
        new PagefindUI({
          element: "#hero-search",
          showSubResults: false,
          showImages: false,
          showFilters: false,
          baseUrl: "{{ "" | relURL }}"
        });
      }

      // Restore query from URL (skip on the dedicated search page, which handles its own restoration)
      if (initialQuery && !document.getElementById('search-page')) {
        const input = document.querySelector('#search input[type=text]');
        if (input) {
          input.value = initialQuery;
          input.dispatchEvent(new Event('input', { bubbles: true }));
        }
      }

      // Sync search query to URL params for bookmarkable filtered searches
      document.addEventListener('input', function(e) {
        if (e.target.closest('#search') && e.target.type === 'text') {
          const url = new URL(window.location);
          const val = e.target.value.trim();
          if (val) {
            url.searchParams.set('q', val);
          } else {
            url.searchParams.delete('q');
          }
          window.history.replaceState({}, '', url);
        }
      });
    });
  </script>
  <script>
    // Dark mode toggle
    const toggle = document.getElementById('theme-toggle');
    const html = document.documentElement;
    const stored = localStorage.getItem('theme');
    if (stored) html.setAttribute('data-theme', stored);

    toggle && toggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Active nav link
    const currentPath = window.location.pathname;
    document.querySelectorAll('.nav-dropdown a, .mobile-nav-links a, .nav-direct-link').forEach(link => {
      const href = link.getAttribute('href');
      if (href && href !== '/' && currentPath.startsWith(href)) {
        link.classList.add('active');
        const group = link.closest('.nav-group');
        if (group) {
          const btn = group.querySelector('.nav-group-btn');
          if (btn) btn.classList.add('active');
        }
      }
    });

    // Desktop dropdown toggle (click for keyboard/touch)
    document.querySelectorAll('.nav-group-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const group = btn.closest('.nav-group');
        const isOpen = group.classList.contains('open');
        document.querySelectorAll('.nav-group.open').forEach(g => {
          g.classList.remove('open');
          g.querySelector('.nav-group-btn').setAttribute('aria-expanded', 'false');
        });
        if (!isOpen) {
          group.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
        }
      });
    });

    document.addEventListener('click', () => {
      document.querySelectorAll('.nav-group.open').forEach(g => {
        g.classList.remove('open');
        g.querySelector('.nav-group-btn').setAttribute('aria-expanded', 'false');
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.nav-group.open').forEach(g => {
          g.classList.remove('open');
          g.querySelector('.nav-group-btn').setAttribute('aria-expanded', 'false');
        });
      }
    });

    // TOC active heading via IntersectionObserver
    const tocLinks = document.querySelectorAll('.toc-inner nav ul li a');
    if (tocLinks.length > 0) {
      const headingMap = new Map();
      tocLinks.forEach(link => {
        const id = decodeURIComponent(link.getAttribute('href').replace('#', ''));
        headingMap.set(id, link);
      });
      let activeId = null;
      const tocObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const id = entry.target.getAttribute('id');
            if (headingMap.has(id)) {
              if (activeId && headingMap.has(activeId)) {
                headingMap.get(activeId).classList.remove('toc-active');
              }
              activeId = id;
              headingMap.get(id).classList.add('toc-active');
            }
          }
        });
      }, { rootMargin: '-80px 0px -65% 0px', threshold: 0 });
      document.querySelectorAll('.article-body h2[id], .article-body h3[id]').forEach(h => tocObserver.observe(h));
    }

    // Mobile hamburger menu
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobile-menu');
    if (hamburger && mobileMenu) {
      hamburger.addEventListener('click', () => {
        const isOpen = hamburger.getAttribute('aria-expanded') === 'true';
        hamburger.setAttribute('aria-expanded', String(!isOpen));
        mobileMenu.setAttribute('aria-hidden', String(isOpen));
        hamburger.setAttribute('aria-label', isOpen ? 'Open menu' : 'Close menu');
      });
      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
          hamburger.setAttribute('aria-expanded', 'false');
          mobileMenu.setAttribute('aria-hidden', 'true');
          hamburger.setAttribute('aria-label', 'Open menu');
        });
      });
    }

    // Copy-to-clipboard for code blocks
    document.querySelectorAll('.code-copy-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const code = btn.closest('.code-block')?.querySelector('code');
        if (!code || !navigator.clipboard) return;
        navigator.clipboard.writeText(code.textContent.trim()).then(() => {
          const label = btn.querySelector('.code-copy-label');
          btn.classList.add('copied');
          if (label) label.textContent = 'Copied';
          setTimeout(() => {
            btn.classList.remove('copied');
            if (label) label.textContent = 'Copy';
          }, 2000);
        }).catch(() => {});
      });
    });
  </script>
</body>
</html>
