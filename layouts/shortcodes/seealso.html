{{/* seealso shortcode
     Usage: {{< seealso >}}
     - [Link text](/path/to/page/): description
     - [Link text](/path/to/page/): description
     {{< /seealso >}}
     Renders as a callout box with linked items.
*/}}
<div class="bz-seealso">
  <div class="bz-seealso-label">
    <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    See also
  </div>
  <div class="bz-seealso-body">{{ .Inner | markdownify }}</div>
</div>
