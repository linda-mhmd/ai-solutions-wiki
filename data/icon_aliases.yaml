# Maps a wiki token (page slug, or a side of an "X-vs-Y" comparison slug) to a base
# icon file in assets/icons/<value>.(svg|png). Only real products get logos; concepts
# (agile, fine-tuning, rag, ...) have no entry and render no logo.
# AWS services use the real per-service AWS architecture icon (png). There is NO generic
# AWS logo fallback: we are not AWS.

# Models / providers
claude: anthropic
claude-enterprise: anthropic
gpt: openai
gpt4: openai
gpt5: openai
chatgpt: openai
azure-openai: openai

# Frameworks that share a brand logo
langgraph: langchain
llama: meta

# AWS service short tokens (used in comparison slugs) -> the real per-service icon file
bedrock: amazon-bedrock
agentcore: bedrock-agentcore
sagemaker: amazon-sagemaker
lambda: aws-lambda
s3: aws-s3
step-functions: aws-step-functions
