# Curated homepage entry points.
#
# These are hand-picked, not measured. The homepage labels them "Most looked up"
# and "Start here" rather than "Trending", because nothing here is derived from
# traffic data — claiming otherwise would be a label the page cannot back up.
#
# If you ever want real trending, the options are a Plausible API call at build
# time (needs an API key as a repo secret plus a fallback for build failures)
# or a computed most-linked-to ranking. Until then: edit this file.
#
# Every url must resolve to a real page. The homepage does not validate them,
# but `make preflight` will fail the build if the target does not exist.

