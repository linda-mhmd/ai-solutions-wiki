# Verbatim chapter transcripts (the rendered subtitles), keyed by composition.
module1:
  - "Module 1: Why this exists."
  - "At the end of 2024, I had four-hundred and ninety-three raw clips sitting on my devices."
  - "Two hundred and five from Las Vegas. Sixty-one from Seattle. Fifty-four from New York."
  - "Seventy-four from Romania, thirty-seven from Prague, sixty-two from a cloud conference in Vienna."
  - "Every single one of them needed editing before it could go anywhere."
  - "Post-production is where video projects die."
  - "It takes forty to sixty hours of editing for every hour of raw interview footage."
  - "Only one in five corporate video projects ships on time."
  - "And by 2025, eighty-two percent of all internet traffic will be video - the demand only goes up."
  - "The content already exists. The bottleneck is the human between filming and publishing."
  - "Three layers turn any upload into three finished, ready-to-publish cuts, automatically."
  - "First: Intake. Validate the file, check the codec, create all the derivatives the rest of the pipeline needs."
  - "Second: Analysis. Three AI services run in parallel - vision, audio, and story - all at once."
  - "Third: Creative. An AI brief is drafted, then eight specialist agents debate and decide the edit."
  - "End to end: under three minutes. Cost per video: thirty-four euro cents."
  - "Three formats out: sixteen-by-nine for YouTube, nine-by-sixteen for Reels, one-by-one for LinkedIn."
  - "Eight AI agents. Thirty-eight Lambda functions. Nine Step Functions workflows."
  - "That is VideoFlow. By the end of this course, you will understand every box in this system."
  - "And in the final module, you will deploy it to your own AWS account."
module2:
  - "Module 2: Cloud in plain words."
  - "Before we look at any diagrams, let's make sure five ideas are absolutely clear."
  - "First: the cloud. It is just someone else's computers, rented by the second."
  - "You do not buy or run servers. You rent computing from AWS and pay only for what you actually use."
  - "Think of it like electricity. You do not build a power plant. You plug in and pay for what you draw."
  - "In VideoFlow, every single box in every diagram is an AWS service we rent. Nothing runs on a machine we own."
  - "Second: serverless, and specifically AWS Lambda."
  - "A Lambda is a function that wakes up for one task, runs for a few seconds, then disappears."
  - "Like a motion-sensor light. It switches on only when something moves. Off the rest of the time."
  - "VideoFlow uses about thirty-eight Lambdas. Each one does exactly one job, then stops."
  - "Third: orchestration - the coordinator that makes sure everything happens in the right order."
  - "AWS Step Functions is a recipe the computer follows, step by step."
  - "It lists the steps, runs them in order, retries on failure, and shows exactly where something broke."
  - "Like a recipe card or an assembly line. Do step one, then step two. You can see which step jammed."
  - "Fourth: AI agents."
  - "An agent is an AI helper that takes several steps on its own - not just one answer to one question."
  - "It plans, uses tools, and works through a task in stages."
  - "Like a film crew. The director does not do everything. Each specialist does their part and hands it on."
  - "VideoFlow has eight agents: a director, editor, cinematographer, sound designer, fact checker, story analyst, pacing analyst, and quality checker."
  - "Fifth: the shape most AI media systems share."
  - "Ingest: store the raw input."
  - "Analyse: understand it, often in parallel."
  - "Decide: let AI choose what to do."
  - "Render: produce the output."
  - "Deliver: get it to the viewer."
  - "VideoFlow is one example of this shape - but the shape works for almost any AI media system you could build."
  - "Those five ideas are all you need before the diagrams make sense. Let's look at the architecture."
module3:
  - "Module 3: The architecture, top down."
  - "Same picture, zoomed in twice. First the whole system, then the pieces it is built from."
  - "Level one: who and what the system talks to."
  - "On the left: creators. They interact through a web UI or an API."
  - "At the top: CI/Ops - the team that deploys the code, using GitHub Actions."
  - "Everything inside the dotted line is one AWS account. That is the trust boundary."
  - "Inside that boundary sits VideoFlow: a configuration-driven video pipeline."
  - "It is orchestrated by Step Functions and Lambda, with AgentCore running the AI crew."
  - "Videos go in via S3. Three finished cuts come out via S3."
  - "VideoFlow calls the AWS AI services: Rekognition, Transcribe, Bedrock, MediaConvert."
  - "Level two: the five container groups that make up VideoFlow."
  - "Interface: a Next.js web app and a FastAPI backend. That is how humans talk to the system."
  - "Orchestration: nine Step Functions workflows and an EventBridge scheduler."
  - "Compute: about thirty-eight Lambda functions and Fargate containers for heavier work."
  - "AI runtime: AgentCore runs the eight-agent crew. Bedrock provides all the language model calls."
  - "State: five different data stores - S3, DynamoDB, OpenSearch, ElastiCache, and Aurora - each for a different job."
  - "And this is how a video moves through the system from upload to finished cut."
  - "A file lands in S3. That event triggers the main Step Functions workflow."
  - "Preprocess: MediaConvert creates the proxy, the audio, and the JPEG frames."
  - "Then three things happen at the same time: Rekognition labels the frames, Transcribe captures every word, Bedrock Data Automation understands the story."
  - "Those three streams merge into a single brief, generated by Bedrock."
  - "The eight-agent crew debates the brief and produces a VariantSpec: the cut list."
  - "The compiler reads the VariantSpec and renders three formats in one final MediaConvert job."
  - "Three finished cuts land in S3. Done."
module4:
  - "Module 4: Inside the pipeline. Follow one upload, all the way through."
  - "Step one: intake. Before a single cent of analysis is spent, the file is validated."
  - "An S3 upload event triggers the workflow. The first Lambda - FileSanitizer - checks the codec, container format, duration, and orientation."
  - "Then: idempotency. Before doing any work, the system checks S3 for existing outputs."
  - "If five or more outputs already exist, the workflow skips. Safe to re-trigger without paying twice."
  - "If the file is new: preprocess. MediaConvert creates a five-forty-p proxy, extracts audio to AAC, and captures JPEG frames every two seconds."
  - "One MediaConvert job. Three outputs. Everything the rest of the pipeline needs."
  - "The five-forty-p proxy is small enough for Bedrock Data Automation to analyse quickly and cheaply."
  - "The AAC audio at ninety-six kilobits per second feeds directly into Transcribe."
  - "The JPEG frames - one every two seconds - feed Rekognition. You can tune the interval: point-five seconds for sports, three seconds for interviews."
  - "Now the most important performance decision in the whole pipeline."
  - "Three independent analyses run at the same time, in a Step Functions Parallel state."
  - "Rekognition calls detect-labels on every JPEG frame, building a visual timeline: what was in frame, and when."
  - "Transcribe produces word-level timestamps with a custom vocabulary - so terms like AgentCore and CrewAI are not mangled."
  - "Bedrock Data Automation watches the whole video and returns a story summary."
  - "Sequential, these three would take about three minutes. In parallel, the workflow waits for the slowest one. Under ninety seconds total."
  - "Each long-running AI job uses the same three-state pattern."
  - "A Task asks for status. A Choice routes on the result: done, error, or still running."
  - "If still running: Wait ten seconds. Execution is paused. No compute is used while waiting."
  - "Then loop back to check again. This pattern makes async jobs cheap to poll and easy to debug."
  - "Three streams converge. Bedrock turns them into one validated brief."
  - "The prompt includes the full transcript, the visual timeline, and the BDA story summary."
  - "Claude returns a structured JSON object: a title under eighty characters, a two-sentence summary, and the key visual elements."
  - "Six validation gates check the output. If any gate fails, the workflow fails loudly - no synthetic fallback, ever."
  - "The brief goes to the eight-agent crew on AgentCore."
  - "The Director sets the narrative arc. The Editor selects and orders the clips."
  - "The Cinematographer checks framing. The Sound Designer syncs audio."
  - "The Fact Checker compares the transcript against the BDA summary. The Story Analyst identifies the emotional arc."
  - "The Pacing Analyst balances cut rhythm. The Quality Checker is the final gate."
  - "Eight agents debating beats one prompt for editorial decisions. The output is a VariantSpec: the exact cut list."
  - "The VariantSpec goes to the compiler Lambda."
  - "It reads the clip list, the transitions, and the format requirements."
  - "One final MediaConvert job renders three aspect ratios simultaneously: sixteen-by-nine for YouTube, nine-by-sixteen for Reels, one-by-one for LinkedIn."
  - "All three land in S3. All three captioned. All three with the intro and outro plates."
  - "One upload in. Three finished cuts out. Under three minutes. Thirty-four euro cents."
module5:
  - "Module 5: The rest of the platform."
  - "The core pipeline handles the main edit. Around it sit four supporting systems."
  - "First: the B-roll sub-pipeline."
  - "The Orchestrator agent plans which shots are needed. A separate Step Functions workflow handles the render queue."
  - "Fargate workers render each B-roll clip in its own container."
  - "A Poller waits for all renders to complete - same async pattern as the main pipeline."
  - "The Finalizer assembles all B-roll clips into the output package."
  - "Second: the travel globe renderer."
  - "When a video features travel between events, the system renders an animated globe showing the route."
  - "Route data is aggregated from event metadata. A frame plan is computed for the animation."
  - "A Fargate worker renders the globe frames using a custom container image built by CodeBuild and stored in ECR."
  - "The frames are encoded to an MP4 clip that slots into the main compile job."
  - "Third: the data layer. Five stores, each chosen for a specific access pattern."
  - "S3 holds three buckets: input videos, output cuts, and shared assets. It is the source of truth for all media."
  - "DynamoDB stores video metadata and job state. Fast key-value lookups for the dashboard and pipeline checks."
  - "OpenSearch handles semantic and full-text search over transcript embeddings. Find any moment across the entire video archive."
  - "ElastiCache caches hot reads: the live dashboard state and current trend snapshots."
  - "Aurora holds relational records where joins and transactions matter - billing, user permissions, job history."
  - "Fourth: the eventing layer. This is what makes the platform proactive, not just reactive."
  - "EventBridge Scheduler runs cron jobs: trend scans, batch analysis of unprocessed clips."
  - "EventBridge also routes real-time events from other parts of the system to the right workflow."
  - "A Viral Trends agent scans social platforms and ranks emerging topics. A batch Analysis Scheduler processes the backlog overnight."
  - "Finally: the web platform. How a human actually operates VideoFlow."
  - "CloudFront serves the Next.js app with caching and TLS. Amplify handles static and server-side rendering."
  - "The dashboard shows live workflow status. The upload page accepts new footage. The MAM is the media asset manager - your full searchable video archive."
  - "An Ant Design wizard guides you through storyboard creation. A FastAPI backend handles all API requests."
  - "That is the full platform. In the next module, we look at what makes it production-grade."
module6:
  - "Module 6: Cheap, fast, and correct. The habits that make it production-grade."
  - "First: security. The principle is least privilege - every service gets only the permissions it actually needs."
  - "Nineteen IAM roles. Twenty-four scoped policies. Each Lambda has its own role. No shared admin credentials."
  - "API keys and secrets live in AWS Secrets Manager and rotate automatically."
  - "Six security groups in a VPC. Workers run in private subnets. No direct internet access."
  - "Runtime config - like thresholds and toggles - lives in SSM Parameter Store. No secrets in environment variables."
  - "Second: the six validation layers that stop confident-but-wrong AI output before it reaches a viewer."
  - "Layer one: input. FileSanitizer checks codec, container, duration, and orientation before any analysis begins."
  - "Layer two: clip. Every clip must have a valid timestamp, a non-zero duration, and a label that matches the source."
  - "Layer three: timestamp integrity. No clip can end after the source video ends."
  - "Layers four, five, and six: schema validation on the Bedrock output, the crew's VariantSpec, and a final quality gate before compile."
  - "If any layer fails, the workflow fails loudly. A bad caption never reaches a viewer."
  - "Third: observability. Three tools that make a two-AM failure legible in seconds."
  - "The Step Functions execution console logs every state transition with its input, output, and the exact error inline. No log hunting."
  - "Lambda Insights tracks duration, memory, and cold starts per function. The frame-object-detector uses provisioned concurrency to avoid cold starts."
  - "AgentCore runs in US East One while the main pipeline runs in EU Central One. A custom log-tail script bridges the two."
  - "Fourth: cost. At ten-thousand videos a month, the entire pipeline costs less than one human editor."
  - "MediaConvert: nine euro cents per video. Transcribe: eleven cents. Rekognition: about seven cents."
  - "Bedrock and BDA: five cents. AgentCore: one cent. Total: roughly thirty-four cents per video."
  - "Ten thousand videos a month is about thirty-four hundred euros total. One month of one human editor."
  - "Fifth: performance. Parallelism, not faster services, is what gets a video under three minutes."
  - "Sequential analysis - Rekognition, then Transcribe, then BDA - would take about three minutes on its own."
  - "The Step Functions Parallel state runs all three at once. The workflow waits for the slowest, not their sum. Under ninety seconds."
  - "Provisioned concurrency on frame-object-detector eliminates cold starts. Wait states cost nothing while async jobs run."
module7:
  - "Module 7: Make it your own, and build."
  - "Every piece is swappable. The core engine is cloud-agnostic. And you can deploy the whole thing in one command."
  - "Every AI service in VideoFlow is behind a provider interface."
  - "TranscriptionProvider defaults to AWS Transcribe. Swap to Google Speech-to-Text, OpenAI Whisper, or ElevenLabs without touching the pipeline."
  - "DetectionProvider defaults to Rekognition. Swap to Google Vision, Azure Computer Vision, or even local OpenCV."
  - "LLMProvider defaults to Bedrock. Swap to direct Anthropic API or OpenAI."
  - "One interface, any backend. This is how you customise VideoFlow for your own use case without re-architecting everything."
  - "The same core engine runs on any cloud - or your own laptop."
  - "On AWS: Lambda plus Step Functions. That is the default deployment you will use today."
  - "On Google Cloud: Cloud Functions plus Workflows. Same logic, different managed services."
  - "On Kubernetes: the same containers run on OpenShift with ArgoCD for GitOps deployment."
  - "Or locally: run the full pipeline on your laptop for development and testing."
  - "To deploy VideoFlow to your own AWS account, you need four things."
  - "One: create a free AWS account at aws.amazon.com. A credit card is required but the free tier covers everything here."
  - "Two: set a five-euro budget alarm immediately. You can never get a surprise bill."
  - "Three: create a non-root admin user. Never build with the root account."
  - "Four: install three free tools on your laptop: Git, Terraform, Docker, and Python."
  - "Watch: one command builds the entire system in your account."
  - "git clone the repository, change into the directory, and run make deploy."
  - "Terraform shows you a plan: twenty-seven Lambdas, nine workflows, IAM roles, S3 buckets."
  - "Confirm, and watch a hundred and forty resources appear in your account."
  - "Now: vibecoding. You describe a change in plain English. AI writes the code."
  - "Say: add a step that also makes a square one-by-one version for Instagram, with the title in the top corner."
  - "The AI edits the compiler Lambda, adds a one-by-one MediaConvert output, and updates the VariantSpec schema."
  - "You read the diff. Run make deploy. Your change is live."
  - "Now: your own footage through the system you just deployed."
  - "Open the upload page. Drop in a video clip."
  - "Watch the Step Functions execution graph light up - each node turning green as it completes."
  - "Two minutes and forty seconds later: three finished cuts in S3. Ready to publish."
module8:
  - "Module 8: Where to go next."
  - "Five ideas from this course that are worth keeping."
  - "One: orchestrate visibly. Step Functions makes every step, every input, and every failure inspectable. No log hunting at two in the morning."
  - "Two: parallelise the analysis. Three concurrent perspectives cut the slow phase from three minutes to under ninety seconds. Parallelism, not faster services."
  - "Three: decide with a crew. Eight specialised agents beat one prompt for editorial judgement, with a quality gate at the end."
  - "Four: validate loudly. Six validation layers stop wrong AI output before it reaches a viewer. Fail fast and fail clearly."
  - "Five: design for swap. Provider interfaces decouple the pipeline from any single cloud vendor. The same core runs everywhere."
  - "Footage that would never have been published now gets published."
  - "That is the value. The architecture just makes it cheap, fast, and correct enough to trust."
  - "The code is on GitHub at github.com/mzzavaa. The blog post walks through every decision at lindamohamed.com."
  - "A demo video runs the full pipeline live at youtu.be/wSCofxpLgZA."
  - "Thank you for watching. Go build something."
