# The verification log, in public.
#
# Every entry is something this wiki got wrong, or something the rest of the
# internet still has wrong, found by checking a page against primary sources.
# The homepage shows the most recent few.
#
# This is deliberately the first thing on the page. A badge saying "verified"
# asserts the work; showing what the work found proves it. Keep the entries
# specific enough that a reader can check them.
#
# `date` is when the correction landed. `page` must resolve to a real page.

- date: 2026-10-08
  page: /tools/claude-anthropic/
  headline: Haiku 5.5 shipped, and Sonnet 5.5's cache-read price in our table was out of date
  body: >
    This page said Haiku 5.5 had not shipped. It shipped on 7 October 2026 as
    claude-haiku-5-5, at $0.10/$0.50 per MTok for prompts up to 100,000 tokens
    and $0.50/$2.50 above, the first Claude model priced by prompt length. The
    same release halved Sonnet 5.5 cache reads from $0.20 to $0.10 per MTok, so
    our pricing table, correct on 3 October, was wrong four days later. Sonnet
    5.5's 1M context and 128K maximum output, which we had left as "not
    published", are now published on Anthropic's pricing page and models
    overview, and are filled in from there rather than inherited from Sonnet 5.

- date: 2026-10-08
  page: /tools/meta-muse/
  headline: Muse is an agent, not a model, and it is not available in the EU
  body: >
    Much of the coverage of Meta's Muse, including the trending explainers,
    blurs the Muse agent with the Muse Spark model and implies Muse can be used
    anywhere. Muse is a personal agent that runs on Muse Spark, available only in
    the US (from 8 September 2026) and Canada (from 18 September). App store
    listings across six EU countries show nothing and Meta has given no European
    date. The new page separates the two, and marks which Muse claims come from
    Meta and which only from reporting, including the widely quoted $20 and $100
    plan prices, which Meta's own announcement does not state.

- date: 2026-10-03
  page: /tools/claude-anthropic/
  headline: Claude Sonnet 5.5 had already shipped while this page said it had not
  body: >
    This page said Anthropic had announced Sonnet 5.5 on 22 September with no
    price, model ID or date published, and that it had not shipped. It shipped on
    28 September 2026 as claude-sonnet-5-5 at $2/$10 per MTok, the same rate as
    Sonnet 5. The page was last verified on 25 September, three days before the
    release, so the statement was true when written and wrong by the time anyone
    read it. Haiku 5.5, announced in the same breath, genuinely has not shipped.
    A dated "as of" line is not a substitute for re-checking the vendor's
    newsroom.

- date: 2026-10-03
  page: /tools/openai-api/
  headline: GPT-6 has four shipping models, not three
  body: >
    The lineup section said GPT-6 has three tiers, Astra, Sol and Luna. GPT-6.1
    Sol shipped on 29 September 2026 at DevDay. It is a point upgrade to Sol
    rather than a fourth tier, but it has its own model ID and its own price row,
    and its cached input is half Sol's at $0.10 per MTok. The headline $2/$10
    rate did not change, which is why this one is easy to miss: the number that
    moved is the one that dominates prompt-heavy bills.

- date: 2026-10-03
  page: /tools/google-gemini/
  headline: Gemini 4 Argon is announced, and still not something you can call
  body: >
    Argon was announced on 30 September 2026 and several write-ups read as though
    it were available. It is not. It is going first to vetted cyber defenders
    through the Fairwind Program, without cyber guardrails for them and Google's
    internal teams, and general access starts later with paid API customers and
    AI Ultra subscribers. Gemini 3.8 Flash is still the model to build on. The
    detail worth keeping: Argon's million-token limit is on output, not input,
    which is the first time that ceiling has moved from 64K.

- date: 2026-09-25
  page: /tools/deepseek/
  headline: DeepSeek V4-Pro was never being folded into the new Flash model
  body: >
    Early reports of DeepSeek's September release said V4-Pro requests would be
    routed to the new V4.1-Flash. We repeated that. DeepSeek's own changelog says
    the opposite: V4-Pro stays, at unchanged prices. It was the old V4-Flash
    names that got rerouted. The claim came from a secondary source, and the
    primary one was a single click away.

- date: 2026-09-25
  page: /tools/azure-openai/
  headline: GPT-6 Astra does have an EU Data Zone on Azure
  body: >
    Two pages here said GPT-6 Astra had no EU Data Zone deployment on Microsoft
    Foundry, which would rule it out for many EU data-residency requirements.
    Microsoft's 22 September GA post lists Astra, Sol and Luna in both the US and
    EU Data Zones. The restriction was true at preview and stopped being true at
    general availability.

- date: 2026-09-09
  page: /tools/meta-llama/
  headline: Llama is no longer Meta's open-weight line either
  body: >
    Everyone knows Meta's frontier work went closed with Muse Spark. The part
    that gets missed: Llama is not the open-weight line anymore either. That is
    Muse Glimmer, 30B and Apache 2.0, since August 2026 - a more permissive
    licence than Llama ever had. Meta shipped no new Llama model in 2026, and
    retired its own hosted Llama API in July.

- date: 2026-09-09
  page: /tools/amazon-nova/
  headline: Most of Amazon's Nova 2 family never actually shipped
  body: >
    Nova 2 was announced at re:Invent in December 2025 with four models. Nine
    months later, Nova 2 Lite is the only one generally available. Pro and Omni
    are still marked "(Preview)" on AWS's own Bedrock pricing page, with access
    via a Nova Forge contract or an account-team request. Meanwhile Nova 1's
    image and video models retire this month with no first-party replacement.

- date: 2026-09-04
  page: /frameworks/eu-ai-act-risk-framework/
  headline: Two pages here disagreed on when the AI Act's transparency rules bite
  body: >
    One page said Article 50 took effect 2 August 2025, another said 2026. The
    regulation's own phased schedule settles it: 2026. Wrong by a year, on the
    obligation that governs labelling AI-generated content - which is the rule
    most readers of this site actually have to comply with.

- date: 2026-09-03
  page: /tools/claude-anthropic/
  headline: "\"1M tokens is about 750,000 words\" stopped being true"
  body: >
    Current-generation Claude models use a tokenizer that produces roughly 30%
    more tokens for the same text. A million tokens is now closer to 555,000
    words. Every context-window estimate built on the old ratio is optimistic by
    a third - including the ones still published in plenty of places. Haiku 4.5
    still uses the old tokenizer, so both numbers are live at once.
