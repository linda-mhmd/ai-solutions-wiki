# The verification log, in public.
#
# Every entry is something this wiki got wrong, or something the rest of the
# internet still has wrong, found by checking a page against primary sources.
# The homepage shows the most recent few.
#
# This is deliberately the first thing on the page. A badge saying "verified"
# asserts the work; showing what the work found proves it. Keep the entries
# specific enough that a reader can check them.
#
# `date` is when the correction landed. `page` must resolve to a real page.

- date: 2026-10-28
  page: /news/open-weight-models-october-2026/
  headline: Moonshot did release a model in October, two days before we said it had not
  body: >
    The October roundup said "nothing new found from Moonshot", based on a
    check of Moonshot's Hugging Face organisation on 25 October. Moonshot had
    announced Kimi K3.1 Pro and K3.1 Pro Highspeed on 23 October, describing
    K3.1 Pro as an open-weight model, with weights promised "by Nov 4" and API
    access from launch. Because the weights were not yet on Hugging Face, a
    check of Hugging Face alone could not find it. The entry now lists K3.1 Pro
    with its API prices and the unpublished licence. The lesson: a model hub
    shows weights, not releases. The lab's own blog and API changelog are the
    primary source for whether something shipped.

- date: 2026-10-25
  page: /news/ai-copyright-litigation-2026/
  headline: The $1.5 billion Anthropic settlement was approved in July, not awaiting approval
  body: >
    This entry described the Bartz v. Anthropic settlement as awaiting final
    approval, and said final approval had not been entered. Judge Araceli
    Martinez-Olguin signed the order granting final approval and entering
    judgment on 20 July 2026 (Dkt. 680), two months before our last check. She
    also cut class counsel's fees from the 12.5 percent requested to
    $101,561,111, about 6.8 percent of the fund. The only notices of appeal came
    from lawyers excluded from the fee award, so the parties say the Effective
    Date has passed, and first payments are expected on or before 15 November
    2026. We had relied on a docket summary instead of the order itself, which
    the settlement website posts in full.

- date: 2026-10-25
  page: /tools/claude-anthropic/
  headline: Sonnet 4.5 was deprecated, and the page still said Haiku 5.5 had not shipped
  body: >
    Two statements here were wrong. The Sonnet paragraph still said Haiku 5.5
    "has still not shipped", while the paragraph above it, correctly, said it
    shipped on 7 October 2026. And the page said Sonnet 4.5 had passed its
    retirement floor "without a deprecation notice, so it remains active".
    Anthropic deprecated claude-sonnet-4-5-20250929 on 30 September 2026, with
    retirement on the Claude API on 30 November 2026 and Sonnet 5.5 as the
    replacement. Haiku 4.5, which also passed its floor on 15 October, is still
    Active with no notice.

- date: 2026-10-25
  page: /tools/openai-api/
  headline: GPT-4o does have a shutdown date now, and our GPT-6.1 Sol model ID was wrong
  body: >
    This page said the base gpt-4o snapshots were still listed with no announced
    retirement. On 14 October 2026 OpenAI deprecated gpt-4o-2024-08-06,
    gpt-4o-2024-11-20, gpt-4o-mini-2024-07-18, gpt-4.1 and gpt-4.1-mini for
    shutdown on 14 January 2027, replacement gpt-6-luna. That is three months'
    notice against the six months OpenAI's own policy gives generally available
    models, and OpenAI gives no reason. The page also gave GPT-6.1 Sol's model ID
    as gpt-6-1-sol; OpenAI's model page and changelog use gpt-6.1-sol, with a dot.

- date: 2026-10-25
  page: /tools/openai-api/
  headline: gpt-4o-mini-tts is deprecated, not OpenAI's current TTS model
  body: >
    We said text-to-speech was the one part of OpenAI's audio stack that had not
    moved and that gpt-4o-mini-tts was still the current recommendation. On 1
    October 2026 OpenAI deprecated tts-1, tts-1-hd and both gpt-4o-mini-tts
    snapshots for shutdown on 6 January 2027. The replacement, gpt-realtime-2.1-mini,
    runs on the Realtime API and is not supported on /v1/audio/speech, so the
    migration is a change of workflow, not of model string.

- date: 2026-10-25
  page: /tools/google-gemini/
  headline: Gemini 3.7 Flash and 3.5 Flash are deprecated and silently routed to other models
  body: >
    This page listed Gemini 3.7 Flash and 3.5 Flash as stable and priced. Google
    deprecated both on 8 October 2026. They no longer appear in AI Studio, and
    API requests are automatically routed to gemini-3.8-flash and
    gemini-3.6-flash. The old model IDs keep answering, because the endpoints are
    not shutting down, which is exactly why a caller may not notice that the model
    behind the ID changed. The same pass corrected the shutdown date of
    gemini-omni-flash-preview, which Google's deprecations page gives as 22
    October 2026, not the 30 September we had.

- date: 2026-10-25
  page: /news/gemini-4-argon/
  headline: Gemini 4 Argon became generally available thirteen days after we said not to plan around it
  body: >
    Our 30 September entry said Argon was announced, not generally available,
    and that builders should not plan a launch around it. Google made
    gemini-4-argon generally available on the paid Gemini API on 13 October 2026.
    It is still not on the Free tier, and its $2/$10 price is introductory: from
    1 December 2026 it is $4/$20. The million-token limit we described as an
    output limit is a single 1,048,576-token window shared by input and output,
    with outputs beyond 64K only through background long decode.

- date: 2026-10-25
  page: /tools/meta-llama/
  headline: Muse Spark weights were published on 15 October
  body: >
    This page said no Muse Spark weights of any version had been published and
    advised planning as if Muse Spark was closed. On 15 October 2026 Meta
    released Muse Spark Open, 816B total and 42B active, on Hugging Face. The
    caveat that matters is the licence: the Muse Model License requires "Built
    with Muse Spark Open" attribution and a separate agreement for
    model-as-a-service businesses above US$20 million in revenue, and the
    download is gated with manual approval. Muse Glimmer is still Meta's only
    Apache 2.0 model.

- date: 2026-10-25
  page: /comparisons/llm-landscape-2026/
  headline: Five statements in the landscape had gone stale or were wrong
  body: >
    The landscape said Sonnet 5.5 and Haiku 5.5 were not released (they shipped
    on 28 September and 7 October), that no Muse Spark weights existed (Muse
    Spark Open, 15 October), that GitHub Copilot was moving its older GPT-5.x
    models onto GPT-5.6 Sol and Luna (the 19 October suggested alternatives were
    GPT-6.1 Sol and GPT-6 Luna), and that MiniMax's price page returned a 404 (it
    now loads, and MiniMax-M3.1-Flash is $0.15/$0.60). It also dated o1's
    retirement to 27 October 2025. Only o1-mini went then; OpenAI's deprecations
    table lists o1 in the 23 October 2026 sweep. GPT-6.1 Sol, Gemini 4 Argon,
    Muse Wonder, Mistral Large 4, Reflection Beam and Nemotron 3.5 Super VL are
    now in the reference.

- date: 2026-10-25
  page: /tools/nvidia-ai/
  headline: There is a new general-purpose Nemotron, three in fact
  body: >
    This page said there had been no new general-purpose Nemotron LLM since 3.5
    Lightning in August. On 15 October 2026 NVIDIA released Nemotron 3.5 Super VL
    (120B total, 12B active, up to 1M context) and Bolt 74B-A9B, and Bolt E4B
    followed on 23 October, all under OpenMDW-1.1. Read the launch claims
    closely: the headline says "highest accuracy", while the body says Super VL's
    accuracy is "comparable with" NVIDIA's largest reasoning model.

- date: 2026-10-25
  page: /tools/xai-grok/
  headline: Grok's speech-to-text default was already 2.0, and 1.0 is now gone
  body: >
    We said grok-voice-transcribe-1.0 remained the default for speech-to-text, so
    2.0 had to be requested explicitly. xAI's release-note entry for Grok Voice
    Transcribe 2.0 says the default is grok-voice-transcribe-2.0, and since 2
    October 2026 version 1.0 has reached end of life, with requests routed to 2.0
    at the same price. The page also now notes that xAI's own documentation calls
    the company SpaceXSI, while AWS's announcements say SpaceXAI.

- date: 2026-10-08
  page: /tools/claude-anthropic/
  headline: Haiku 5.5 shipped, and Sonnet 5.5's cache-read price in our table was out of date
  body: >
    This page said Haiku 5.5 had not shipped. It shipped on 7 October 2026 as
    claude-haiku-5-5, at $0.10/$0.50 per MTok for prompts up to 100,000 tokens
    and $0.50/$2.50 above, the first Claude model priced by prompt length. The
    same release halved Sonnet 5.5 cache reads from $0.20 to $0.10 per MTok, so
    our pricing table, correct on 3 October, was wrong four days later. Sonnet
    5.5's 1M context and 128K maximum output, which we had left as "not
    published", are now published on Anthropic's pricing page and models
    overview, and are filled in from there rather than inherited from Sonnet 5.

- date: 2026-10-08
  page: /tools/meta-muse/
  headline: Muse is an agent, not a model, and it is not available in the EU
  body: >
    Much of the coverage of Meta's Muse, including the trending explainers,
    blurs the Muse agent with the Muse Spark model and implies Muse can be used
    anywhere. Muse is a personal agent that runs on Muse Spark, available only in
    the US (from 8 September 2026) and Canada (from 18 September). App store
    listings across six EU countries show nothing and Meta has given no European
    date. The new page separates the two, and marks which Muse claims come from
    Meta and which only from reporting, including the widely quoted $20 and $100
    plan prices, which Meta's own announcement does not state.

- date: 2026-10-03
  page: /tools/claude-anthropic/
  headline: Claude Sonnet 5.5 had already shipped while this page said it had not
  body: >
    This page said Anthropic had announced Sonnet 5.5 on 22 September with no
    price, model ID or date published, and that it had not shipped. It shipped on
    28 September 2026 as claude-sonnet-5-5 at $2/$10 per MTok, the same rate as
    Sonnet 5. The page was last verified on 25 September, three days before the
    release, so the statement was true when written and wrong by the time anyone
    read it. Haiku 5.5, announced in the same breath, genuinely has not shipped.
    A dated "as of" line is not a substitute for re-checking the vendor's
    newsroom.

- date: 2026-10-03
  page: /tools/openai-api/
  headline: GPT-6 has four shipping models, not three
  body: >
    The lineup section said GPT-6 has three tiers, Astra, Sol and Luna. GPT-6.1
    Sol shipped on 29 September 2026 at DevDay. It is a point upgrade to Sol
    rather than a fourth tier, but it has its own model ID and its own price row,
    and its cached input is half Sol's at $0.10 per MTok. The headline $2/$10
    rate did not change, which is why this one is easy to miss: the number that
    moved is the one that dominates prompt-heavy bills.

- date: 2026-10-03
  page: /tools/google-gemini/
  headline: Gemini 4 Argon is announced, and still not something you can call
  body: >
    Argon was announced on 30 September 2026 and several write-ups read as though
    it were available. It is not. It is going first to vetted cyber defenders
    through the Fairwind Program, without cyber guardrails for them and Google's
    internal teams, and general access starts later with paid API customers and
    AI Ultra subscribers. Gemini 3.8 Flash is still the model to build on. The
    detail worth keeping: Argon's million-token limit is on output, not input,
    which is the first time that ceiling has moved from 64K.

- date: 2026-09-25
  page: /tools/deepseek/
  headline: DeepSeek V4-Pro was never being folded into the new Flash model
  body: >
    Early reports of DeepSeek's September release said V4-Pro requests would be
    routed to the new V4.1-Flash. We repeated that. DeepSeek's own changelog says
    the opposite: V4-Pro stays, at unchanged prices. It was the old V4-Flash
    names that got rerouted. The claim came from a secondary source, and the
    primary one was a single click away.

- date: 2026-09-25
  page: /tools/azure-openai/
  headline: GPT-6 Astra does have an EU Data Zone on Azure
  body: >
    Two pages here said GPT-6 Astra had no EU Data Zone deployment on Microsoft
    Foundry, which would rule it out for many EU data-residency requirements.
    Microsoft's 22 September GA post lists Astra, Sol and Luna in both the US and
    EU Data Zones. The restriction was true at preview and stopped being true at
    general availability.

- date: 2026-09-09
  page: /tools/meta-llama/
  headline: Llama is no longer Meta's open-weight line either
  body: >
    Everyone knows Meta's frontier work went closed with Muse Spark. The part
    that gets missed: Llama is not the open-weight line anymore either. That is
    Muse Glimmer, 30B and Apache 2.0, since August 2026 - a more permissive
    licence than Llama ever had. Meta shipped no new Llama model in 2026, and
    retired its own hosted Llama API in July.

- date: 2026-09-09
  page: /tools/amazon-nova/
  headline: Most of Amazon's Nova 2 family never actually shipped
  body: >
    Nova 2 was announced at re:Invent in December 2025 with four models. Nine
    months later, Nova 2 Lite is the only one generally available. Pro and Omni
    are still marked "(Preview)" on AWS's own Bedrock pricing page, with access
    via a Nova Forge contract or an account-team request. Meanwhile Nova 1's
    image and video models retire this month with no first-party replacement.

- date: 2026-09-04
  page: /frameworks/eu-ai-act-risk-framework/
  headline: Two pages here disagreed on when the AI Act's transparency rules bite
  body: >
    One page said Article 50 took effect 2 August 2025, another said 2026. The
    regulation's own phased schedule settles it: 2026. Wrong by a year, on the
    obligation that governs labelling AI-generated content - which is the rule
    most readers of this site actually have to comply with.

- date: 2026-09-03
  page: /tools/claude-anthropic/
  headline: "\"1M tokens is about 750,000 words\" stopped being true"
  body: >
    Current-generation Claude models use a tokenizer that produces roughly 30%
    more tokens for the same text. A million tokens is now closer to 555,000
    words. Every context-window estimate built on the old ratio is optimistic by
    a third - including the ones still published in plenty of places. Haiku 4.5
    still uses the old tokenizer, so both numbers are live at once.
