# =============================================================================
# IT HISTORY TIMELINE - single source of truth
# Used by layouts/explore/it-timeline.html and the history article cluster.
#
# Trustworthiness rules (do not break):
#   - `year` is the REAL-WORLD origin (invention or first public appearance),
#     not when this wiki documented it.
#   - every item carries at least one primary `sources` entry, verified by
#     fetching it during research. `kind` records the source type.
#   - NO em-dashes anywhere. Plain hyphens only.
#
# Relationship semantics (drive the legacy -> successor arcs in the view):
#   - superseded_by: [ids]  -> this thing was replaced or largely superseded by Y
#   - abstraction_of: [ids] -> THIS is the higher-level abstraction that sits on
#                              top of and hides Y (Y still exists underneath)
# =============================================================================

lifecycles:
  - id: active
    label: "Active"
    color: "#22c55e"
    desc: "Current and recommended for new work."
  - id: maintenance
    label: "Maintenance only"
    color: "#84cc16"
    desc: "Still supported, but no major new features. Past its peak."
  - id: closed-to-new
    label: "Closed to new customers"
    color: "#f59e0b"
    desc: "Existing users are kept, but the old model is no longer sold to newcomers."
  - id: legacy-accepted
    label: "Legacy, still running"
    color: "#06b6d4"
    desc: "Past its prime, kept alive because replacing it costs too much."
  - id: discontinued
    label: "Discontinued / end of life"
    color: "#e0314b"
    desc: "No longer supported or available."
  - id: milestone
    label: "Concept, standard or event"
    color: "#a855f7"
    desc: "An idea, standard, paper or event rather than a product with a lifecycle."

categories:
  - {id: foundation,     label: "Foundations",          color: "#e0314b"}
  - {id: computing,      label: "Hardware",             color: "#84cc16"}
  - {id: architecture,   label: "Architecture",         color: "#3b82f6"}
  - {id: infrastructure, label: "Infrastructure",       color: "#06b6d4"}
  - {id: tools,          label: "Languages and tools",  color: "#22c55e"}
  - {id: patterns,       label: "Practices",            color: "#f59e0b"}
  - {id: models,         label: "AI and models",        color: "#f97316"}
  - {id: vendor,         label: "Vendors and products", color: "#14b8a6"}
  - {id: legal,          label: "Licensing and legal",  color: "#ec4899"}
  - {id: governance,     label: "Trends and governance",color: "#a855f7"}

eras:
  - id: pre-electronic
    name: "Pre-electronic computing"
    span: "Antiquity to 1930s"
    driver: "Calculation was done by hand or by gears. Each device automated one more step of arithmetic or logic, building the ideas that electronic computers would later run."
  - id: electronic-dawn
    name: "The electronic dawn"
    span: "1940s to 1950s"
    driver: "Vacuum tubes and then the transistor let machines compute with electricity instead of moving parts. Computing went from one-off lab experiments to the first commercial machines."
  - id: mainframe
    name: "The mainframe era"
    span: "1960s to 1970s"
    driver: "Computers were rare, huge and expensive, so one central machine served many users. Shared architectures, the first networks and the relational database appeared."
  - id: pc-client-server
    name: "PC and client-server"
    span: "1980s to early 1990s"
    driver: "Cheap microprocessors put a computer on every desk. Work moved off the central machine, and open standards let independent vendors build a whole ecosystem."
  - id: web
    name: "The web and enterprise"
    span: "mid-1990s to 2005"
    driver: "The web connected personal computers to the entire world. Browsers, open-source servers and the first internet businesses defined the dot-com era."
  - id: cloud
    name: "The cloud era"
    span: "2006 to 2010"
    driver: "Renting computing by the hour replaced buying servers. Amazon, Google and Microsoft turned infrastructure into a utility, and the smartphone put it in every pocket."
  - id: cloud-native
    name: "Cloud-native and DevOps"
    span: "2011 to 2019"
    driver: "Containers and orchestration made software portable and elastic. Teams adopted DevOps, microservices and automation to ship continuously at scale."
  - id: ai-native
    name: "AI-native and the license wars"
    span: "2020 to now"
    driver: "Transformer models turned data into general capability, while a wave of open-source relicensing and vendor consolidation reminded everyone that IT is contracts as much as code."

items:

  # ===== PRE-ELECTRONIC =====

  - id: abacus
    label: "Abacus"
    year: -2300
    year_label: "c. 2300 BCE"
    invented: "Counting devices emerged in Sumer around 2700 to 2300 BCE. The Salamis Tablet (c. 300 BCE) is the oldest surviving counting board."
    standardized: "Settled into regional forms: the Roman hand-abacus, the Chinese suanpan and later the Japanese soroban."
    era: pre-electronic
    cat: computing
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A manual counting frame that represents place values with beads or pebbles in columns. A person can add, subtract, multiply and divide by moving counters."
    why: "It was humanity's first reusable calculating device, and it is still used to teach arithmetic today."
    legal: ""
    superseded_by: [pascaline]
    abstraction_of: []
    sources:
      - {title: "Salamis tablet, marble (Computer History Museum, CHM Revolution)", url: "https://www.computerhistory.org/revolution/artifact/1/128", kind: archive}

  - id: pascaline
    label: "Pascaline (Pascal's calculator)"
    year: 1642
    year_label: "1642"
    invented: "Blaise Pascal designed and built the Pascaline in 1642 in Rouen, France, to help with his father's tax accounting."
    standardized: "Pascal received a Royal Privilege in 1649 granting exclusive rights to make and sell the machine in France."
    era: pre-electronic
    cat: computing
    lifecycle: milestone
    wiki_url: ""
    desc: "A mechanical adding machine that used geared ten-tooth wheels to add and subtract, with carries propagated automatically. Multiplication and division were done by repeated addition."
    why: "It was one of the first working mechanical calculators and proved arithmetic could be automated by gears."
    legal: "Royal Privilege (a monopoly grant) issued to Pascal in 1649."
    superseded_by: [leibniz-reckoner]
    abstraction_of: []
    sources:
      - {title: "Pascaline, Mechanical Calculator (Britannica)", url: "https://www.britannica.com/technology/Pascaline", kind: secondary}

  - id: leibniz-reckoner
    label: "Leibniz Step Reckoner"
    year: 1672
    year_label: "1672 to 1694"
    invented: "Gottfried Wilhelm Leibniz designed the Step Reckoner from around 1672, presenting a wooden model to the Royal Society, and completed working brass machines by 1694."
    standardized: "Leibniz's stepped-drum mechanism became a standard calculator design reused for the next 250 years."
    era: pre-electronic
    cat: computing
    lifecycle: milestone
    wiki_url: ""
    desc: "A mechanical calculator using Leibniz's stepped drum and a movable carriage. It was the first machine that could perform all four arithmetic operations."
    why: "It introduced the stepped drum, a mechanism reused in calculators for centuries, and showed full arithmetic could be mechanized."
    legal: ""
    superseded_by: [analytical-engine]
    abstraction_of: [pascaline]
    sources:
      - {title: "A Leibniz Stepped Reckoner calculator (Computer History Museum)", url: "https://www.computerhistory.org/revolution/calculators/1/49/198", kind: archive}

  - id: jacquard-loom
    label: "Jacquard loom (punched-card control)"
    year: 1804
    year_label: "1804"
    invented: "Joseph-Marie Jacquard developed his punched-card loom control in France around 1804, building on earlier punched designs by Vaucanson."
    standardized: "The chained-punched-card loom spread rapidly across the European textile industry and became the dominant pattern-weaving method."
    era: pre-electronic
    cat: foundation
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A loom controlled by a chain of punched cards, where holes in each card select which threads lift for each row. It automated complex patterned weaving."
    why: "It was the first use of stored, interchangeable instructions on punched cards, directly inspiring Babbage and Hollerith."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "Joseph Marie Jacquard (IEEE Computer Society, Computer Pioneers)", url: "https://history.computer.org/pioneers/jacquard.html", kind: secondary}

  - id: analytical-engine
    label: "Babbage's Analytical and Difference Engines"
    year: 1837
    year_label: "Difference Engine 1822, Analytical Engine from 1837"
    invented: "Charles Babbage announced the Difference Engine in 1822 and began designing the general-purpose Analytical Engine from 1837 in London."
    standardized: "Never completed in his lifetime. The Science Museum London built a working Difference Engine No. 2 to his designs in 1991."
    era: pre-electronic
    cat: computing
    lifecycle: milestone
    wiki_url: ""
    desc: "The Analytical Engine was a design for a general-purpose, programmable mechanical computer with a processing mill, a memory store and punched-card input."
    why: "It was the first design for a general-purpose programmable computer, anticipating the stored-program machine by a century."
    legal: ""
    superseded_by: [eniac]
    abstraction_of: [jacquard-loom]
    sources:
      - {title: "Overview, The Babbage Engine (Computer History Museum)", url: "https://www.computerhistory.org/babbage/overview/", kind: archive}
      - {title: "Charles Babbage's Difference Engines (Science Museum London)", url: "https://www.sciencemuseum.org.uk/objects-and-stories/charles-babbages-difference-engines-and-science-museum", kind: archive}

  - id: first-algorithm
    label: "Ada Lovelace's algorithm (Note G)"
    year: 1843
    year_label: "1843"
    invented: "Ada Lovelace published Note G, an algorithm to compute Bernoulli numbers on Babbage's Analytical Engine, in her 1843 translation of Menabrea's Sketch of the Analytical Engine."
    standardized: ""
    era: pre-electronic
    cat: foundation
    lifecycle: milestone
    wiki_url: ""
    desc: "A step-by-step table of operations for the Analytical Engine that computes Bernoulli numbers using loops. It is widely regarded as the first published algorithm intended for a machine."
    why: "It showed that a machine could be programmed to do more than fixed calculation, making Lovelace an early conceptual programmer."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "Menabrea, Sketch of the Analytical Engine, trans. A.A.L., Scientific Memoirs Vol. 3 (1843), Wikisource primary text", url: "https://en.wikisource.org/wiki/Scientific_Memoirs/3/Sketch_of_the_Analytical_Engine_invented_by_Charles_Babbage,_Esq.", kind: archive}

  - id: boolean-algebra
    label: "Boolean algebra"
    year: 1847
    year_label: "1847, expanded 1854"
    invented: "George Boole introduced his algebra of logic in The Mathematical Analysis of Logic (1847) and developed it fully in An Investigation of the Laws of Thought (1854)."
    standardized: "Became the formal basis of digital logic after Shannon applied it to switching circuits in 1937."
    era: pre-electronic
    cat: foundation
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A system of algebra in which variables take only the values true and false (1 and 0) and combine via AND, OR and NOT. It treats logic as a branch of mathematics."
    why: "It is the mathematical foundation of every digital circuit and all computer logic."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "An Investigation of the Laws of Thought (George Boole, 1854), full text, Internet Archive", url: "https://archive.org/details/investigationofl00boolrich", kind: book}
      - {title: "George Boole (Stanford Encyclopedia of Philosophy)", url: "https://plato.stanford.edu/entries/boole/", kind: secondary}

  - id: punched-cards
    label: "Hollerith punched-card tabulator"
    year: 1890
    year_label: "1889 patent, 1890 census"
    invented: "Herman Hollerith patented the electromechanical punched-card tabulator (US Patent 395,782, granted 1889) and used it to process the 1890 US Census."
    standardized: "Hollerith's company merged in 1911 and was renamed IBM in 1924. Punched cards became the dominant data medium for decades."
    era: pre-electronic
    cat: computing
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A system that recorded data as holes punched in cards, then counted and sorted the cards electromechanically. It cut the 1890 census tabulation from years to months."
    why: "It launched mechanized data processing and the company that became IBM, making punched cards the standard input medium into the 1970s."
    legal: "US Patent 395,782, Art of Compiling Statistics, granted 1889."
    superseded_by: [core-memory]
    abstraction_of: [jacquard-loom]
    sources:
      - {title: "Herman Hollerith Receives a Patent (Computer History Museum, This Day in History)", url: "https://www.computerhistory.org/tdih/january/8/", kind: archive}
      - {title: "Herman Hollerith and Mechanical Tabulation (US Census Bureau History)", url: "https://www.census.gov/about/history/stories/monthly/2016/january-2016.html", kind: archive}

  - id: turing-machine
    label: "Turing machine (On Computable Numbers)"
    year: 1936
    year_label: "1936"
    invented: "Alan Turing wrote On Computable Numbers, with an Application to the Entscheidungsproblem (received 28 May 1936), published in the Proceedings of the London Mathematical Society."
    standardized: "The Turing machine became the standard formal model of computation, central to computability theory."
    era: pre-electronic
    cat: foundation
    lifecycle: milestone
    wiki_url: ""
    desc: "An abstract machine that reads and writes symbols on an infinite tape according to a finite table of rules. Turing used it to define which problems are computable."
    why: "It gave a precise mathematical definition of computation and the universal computer, the theoretical foundation of computer science."
    legal: ""
    superseded_by: []
    abstraction_of: [boolean-algebra]
    sources:
      - {title: "A. M. Turing, On Computable Numbers, Proc. London Math. Soc. ser. 2 vol. 42 (1936-37), full text PDF", url: "https://people.math.ethz.ch/~halorenz/4students/Literatur/TuringFullText.pdf", kind: paper}

  - id: shannon-info
    label: "Shannon: switching logic and information theory"
    year: 1937
    year_label: "1937 thesis, 1948 information theory"
    invented: "Claude Shannon's 1937 MIT master's thesis applied Boolean algebra to relay and switching circuits. His 1948 paper A Mathematical Theory of Communication founded information theory."
    standardized: "The 1948 paper, in the Bell System Technical Journal, established information theory and the bit as the unit of information."
    era: pre-electronic
    cat: foundation
    lifecycle: milestone
    wiki_url: ""
    desc: "Shannon's thesis showed electrical switching circuits can implement Boolean logic. His 1948 paper defined information mathematically, introduced the bit and set limits on reliable communication."
    why: "Together these works gave digital logic its mathematical basis and created information theory, underpinning all computing and communication."
    legal: ""
    superseded_by: []
    abstraction_of: [boolean-algebra]
    sources:
      - {title: "C. E. Shannon, A symbolic analysis of relay and switching circuits (MIT thesis), DSpace@MIT", url: "https://dspace.mit.edu/handle/1721.1/11173", kind: archive}
      - {title: "C. E. Shannon, A Mathematical Theory of Communication, Bell System Technical Journal 27 (1948)", url: "https://onlinelibrary.wiley.com/doi/abs/10.1002/j.1538-7305.1948.tb01338.x", kind: paper}

  # ===== ELECTRONIC DAWN =====

  - id: eniac
    label: "ENIAC"
    year: 1945
    year_label: "1945 operational, unveiled 1946"
    invented: "J. Presper Eckert and John Mauchly built ENIAC at the University of Pennsylvania's Moore School. It ran in 1945 and was unveiled on 14 February 1946."
    standardized: "It operated until 1955 and set the template for electronic computing."
    era: electronic-dawn
    cat: computing
    lifecycle: milestone
    wiki_url: ""
    desc: "A room-sized machine of about 17,468 vacuum tubes, the first general-purpose, electronic, programmable computer in the US. It computed artillery firing tables far faster than any earlier machine."
    why: "It proved large-scale electronic computation was practical, launching the electronic computer era."
    legal: ""
    superseded_by: [univac]
    abstraction_of: [analytical-engine]
    sources:
      - {title: "ENIAC (Penn Engineering, University of Pennsylvania)", url: "https://www.engineering.upenn.edu/about/history-heritage/eniac/", kind: archive}

  - id: von-neumann
    label: "von Neumann architecture (EDVAC report)"
    year: 1945
    year_label: "1945"
    invented: "John von Neumann wrote the First Draft of a Report on the EDVAC, circulated 30 June 1945 at the Moore School, University of Pennsylvania."
    standardized: "The stored-program von Neumann architecture became the de facto standard organization for nearly all general-purpose computers since."
    era: electronic-dawn
    cat: architecture
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A computer design in which both program instructions and data are held in the same read-write memory, processed by a single control unit and arithmetic unit. This is the stored-program concept."
    why: "It defined the architecture that almost every modern computer still follows."
    legal: ""
    superseded_by: []
    abstraction_of: [eniac]
    sources:
      - {title: "John von Neumann, First Draft of a Report on the EDVAC (1945), full text, Internet Archive", url: "https://archive.org/details/vnedvac", kind: archive}

  - id: transistor
    label: "Transistor"
    year: 1947
    year_label: "1947"
    invented: "John Bardeen and Walter Brattain, in William Shockley's group at Bell Labs, demonstrated the first working point-contact transistor on 16 December 1947."
    standardized: "Announced 30 June 1948. The junction and silicon transistors made it the standard electronic switch by the late 1950s."
    era: electronic-dawn
    cat: computing
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A solid-state semiconductor device that amplifies or switches electrical signals. It replaced the bulky, hot, fragile vacuum tube."
    why: "It is the fundamental building block of all modern electronics and the chips inside every computer."
    legal: "US Patent 2,524,035 (filed 1948, issued 1950)."
    superseded_by: [integrated-circuit]
    abstraction_of: []
    sources:
      - {title: "1947: Invention of the Point-Contact Transistor (Computer History Museum, The Silicon Engine)", url: "https://www.computerhistory.org/siliconengine/invention-of-the-point-contact-transistor/", kind: archive}

  - id: univac
    label: "UNIVAC I"
    year: 1951
    year_label: "1951"
    invented: "Designed by Eckert and Mauchly (later Remington Rand). The first unit was accepted by the US Census Bureau in 1951."
    standardized: "Forty-six UNIVAC I machines were built. It established the commercial computer market."
    era: electronic-dawn
    cat: computing
    lifecycle: milestone
    wiki_url: ""
    desc: "The first commercially produced electronic digital computer in the United States, built for business and government data processing. It used vacuum tubes and magnetic tape."
    why: "It moved electronic computing out of the lab into commercial use, starting the computer industry."
    legal: ""
    superseded_by: []
    abstraction_of: [eniac]
    sources:
      - {title: "UNIVAC I (US Census Bureau History)", url: "https://www.census.gov/about/history/bureau-history/census-innovations/technology/univac-i.html", kind: archive}

  - id: core-memory
    label: "Magnetic-core memory"
    year: 1953
    year_label: "early 1950s, Whirlwind 1953"
    invented: "Jay Forrester at MIT developed coincident-current magnetic-core memory for Project Whirlwind, demonstrated in 1953."
    standardized: "Core memory was the dominant computer main memory through the 1950s and 1960s, until semiconductor RAM replaced it in the 1970s."
    era: electronic-dawn
    cat: computing
    lifecycle: discontinued
    wiki_url: ""
    desc: "Memory built from tiny magnetizable ferrite rings threaded on a grid of wires, each ring storing one bit by its magnetization. It gave fast, reliable, non-volatile random access."
    why: "It provided the first practical fast random-access memory, enabling reliable interactive and real-time computers."
    legal: "Forrester patent US 2,736,880. IBM paid MIT a large settlement for rights in 1964."
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "1953: Whirlwind computer debuts core memory (Computer History Museum, The Storage Engine)", url: "https://www.computerhistory.org/storageengine/whirlwind-computer-debuts-core-memory/", kind: archive}

  - id: compiler
    label: "First compiler (Grace Hopper's A-0)"
    year: 1952
    year_label: "1951 to 1952"
    invented: "Grace Hopper wrote the A-0 system for UNIVAC I in 1951 to 1952 and described automatic programming in her 1952 ACM paper The Education of a Computer."
    standardized: "Recognized as an IEEE Milestone. The compiler idea led to FLOW-MATIC, FORTRAN and COBOL."
    era: electronic-dawn
    cat: tools
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "The A-0 system translated symbolic code into machine code that UNIVAC could run. It was an early translator program, closer to a loader and linker than a modern compiler."
    why: "It introduced the idea that a program could write programs, removing the need to hand-code in machine language."
    legal: ""
    superseded_by: [fortran]
    abstraction_of: []
    sources:
      - {title: "Grace Hopper, The Education of a Computer, Proceedings of the 1952 ACM National Meeting (ACM Digital Library)", url: "https://dl.acm.org/doi/10.1145/609784.609818", kind: paper}

  - id: fortran
    label: "FORTRAN"
    year: 1957
    year_label: "1957, spec 1954 to 1956"
    invented: "John Backus's team at IBM developed FORTRAN for the IBM 704. The reference manual is dated 1956 and the system shipped to customers in April 1957."
    standardized: "First standardized by ASA (later ANSI) in 1966, with later ISO standards."
    era: electronic-dawn
    cat: tools
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "FORTRAN (FORmula TRANslation) was the first widely used high-level programming language, aimed at scientific and engineering calculation. Its compiler produced efficient machine code from algebra-like statements."
    why: "It proved high-level languages could be both usable and fast, making programming accessible beyond machine-code specialists."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "FORTRAN (Computer History Museum Software Preservation, original IBM documents)", url: "https://softwarepreservation.computerhistory.org/FORTRAN/", kind: archive}

  - id: integrated-circuit
    label: "Integrated circuit"
    year: 1958
    year_label: "1958 to 1959"
    invented: "Jack Kilby at Texas Instruments built the first working integrated circuit in 1958. Robert Noyce at Fairchild independently devised the practical monolithic silicon IC, filing his patent in 1959."
    standardized: "Monolithic silicon ICs became the universal basis of microelectronics in the 1960s."
    era: electronic-dawn
    cat: computing
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "A single chip of semiconductor that holds many interconnected components formed together. It replaced wiring discrete parts by hand."
    why: "It made electronics small, cheap and reliable at scale, enabling microprocessors and the entire modern computing industry."
    legal: "Kilby (TI) and Noyce (Fairchild) patents, followed by years of dispute and cross-licensing."
    superseded_by: [intel-4004]
    abstraction_of: [transistor]
    sources:
      - {title: "1959: Practical Monolithic Integrated Circuit Concept Patented (Computer History Museum)", url: "https://www.computerhistory.org/siliconengine/practical-monolithic-integrated-circuit-concept-patented/", kind: archive}

  - id: cobol
    label: "COBOL"
    year: 1959
    year_label: "1959 to 1960"
    invented: "COBOL was defined by the CODASYL committee, convened by the US Department of Defense in 1959. Grace Hopper's FLOW-MATIC heavily influenced its design."
    standardized: "The COBOL-60 specifications were approved in 1960 and published by the US Government. Later standardized by ANSI (1968) and ISO."
    era: electronic-dawn
    cat: tools
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "COBOL (COmmon Business-Oriented Language) is a high-level language for business data processing, using English-like syntax so programs read like prose."
    why: "It standardized business computing and still runs critical banking, government and insurance systems today."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "COBOL: Initial Specifications for a Common Business Oriented Language (CODASYL, 1960), bitsavers scan", url: "https://www.bitsavers.org/pdf/codasyl/COBOL_Report_Apr60.pdf", kind: standard}

  # ===== MAINFRAME =====

  - id: system-360
    label: "IBM System/360"
    year: 1964
    year_label: "1964"
    invented: "IBM announced the System/360 on 7 April 1964, the first family of computers built to share one architecture across a full range of machine sizes."
    standardized: "Its instruction-set architecture became a long-lived standard. IBM Z mainframes continue the lineage today."
    era: mainframe
    cat: computing
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "The first family of computers built to share one architecture and software across many machine sizes. A program written for a small model ran on a large one without rewriting."
    why: "It established the idea of a compatible computer family and an instruction set that outlives any single machine, a lineage that still runs core banking systems."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "The IBM System/360 (IBM official history)", url: "https://www.ibm.com/history/system-360", kind: archive}
      - {title: "IBM Announces System/360 Computer Family (Computer History Museum)", url: "https://www.computerhistory.org/tdih/april/7/", kind: archive}

  - id: moores-law
    label: "Moore's law"
    year: 1965
    year_label: "1965"
    invented: "Gordon Moore, Cramming more components onto integrated circuits, Electronics magazine, 19 April 1965."
    standardized: ""
    era: mainframe
    cat: foundation
    lifecycle: milestone
    wiki_url: ""
    desc: "Moore observed that the number of components on an integrated circuit was doubling at a regular pace. The observation guided the semiconductor industry for decades."
    why: "It set the long-run expectation that computing gets exponentially cheaper and denser over time, shaping chip roadmaps and the economics of the whole industry."
    legal: ""
    superseded_by: []
    abstraction_of: []
    sources:
      - {title: "Cramming more components onto integrated circuits (Computer History Museum catalog of the original article)", url: "https://www.computerhistory.org/collections/catalog/102770822", kind: paper}

  - id: arpanet
    label: "ARPANET"
    year: 1969
    year_label: "1969"
    invented: "The first host-to-host message was sent on 29 October 1969 from UCLA to SRI. The login attempt crashed after two characters, so the first text transmitted was lo."
    standardized: "Operational through the 1970s and 1980s, decommissioned in 1990 once its lineage was absorbed into the TCP/IP internet."
    era: mainframe
    cat: infrastructure
    lifecycle: legacy-accepted
    wiki_url: ""
    desc: "The first operational packet-switched computer network and the direct ancestor of the internet. Its first message was sent between UCLA and SRI in 1969."
